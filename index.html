<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Design Wars Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SIMULATION CONTENT GENERATOR</div>
        <h1>DESIGN WARS</h1>
      </div>
      <div class="controls">
        <button id="startBtn">START SIMULATION</button>
        <button id="resetBtn" class="secondary">RESET</button>
      </div>
    </header>

    <section class="hud">
      <div class="hud-card"><span>TIME</span><strong id="timer">60.0</strong></div>
      <div class="hud-card"><span>PHASE</span><strong id="phase">READY</strong></div>
      <div class="hud-card leader-card"><span>LEADER</span><strong id="leader">—</strong></div>
      <div class="hud-card chaos-card"><span>CHAOS</span><strong id="chaos">0%</strong></div>
    </section>

    <section class="simulation-layout">
      <div id="game-container" class="arena-wrap"></div>
      <aside class="sidebar">
        <div class="leaderboard-panel">
          <div class="panel-title">LIVE STANDINGS</div>
          <div id="leaderboard"></div>
        </div>
        <div class="event-panel">
          <div class="panel-title">ARENA FEED</div>
          <div id="eventFeed" class="event-feed"><div class="feed-empty">Waiting for bad decisions...</div></div>
        </div>
        <div class="legend-note">Four philosophies enter. Furniture does not stand a chance.</div>
      </aside>
    </section>

    <div id="resultOverlay" class="result-overlay hidden">
      <div class="result-card">
        <div class="eyebrow">SIMULATION COMPLETE</div>
        <div class="winner-label">WINNER</div>
        <h2 id="winnerName">—</h2>
        <div id="winnerScore" class="winner-score">0</div>
        <div id="winnerSummary" class="winner-summary"></div>
        <div class="result-subtitle">TOP 5 COLLECTED ITEMS</div>
        <ol id="topItems"></ol>
        <button id="againBtn">RUN IT AGAIN</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>

  <script>
    // -----------------------------------------------------------------------
    // PHYSICS OVERRIDE
    // -----------------------------------------------------------------------
    // The designers should behave like the balls in the satisfying physics
    // videos: constant speed, clean reflection, no wall-hugging and only a
    // tiny change of direction when an impact occurs.

    setConstantSpeed = function (designer, angle) {
      const body = designer && designer.gameObject && designer.gameObject.body;
      if (!body || !scene || !scene.matter) return;

      body.isSleeping = false;
      scene.matter.body.setVelocity(body, {
        x: Math.cos(angle) * CONFIG.designerCruiseSpeed,
        y: Math.sin(angle) * CONFIG.designerCruiseSpeed
      });
    };

    maintainSpeed = function (designer) {
      const body = designer && designer.gameObject && designer.gameObject.body;
      if (!body || !scene || !scene.matter) return;

      body.isSleeping = false;
      const speed = Math.hypot(body.velocity.x, body.velocity.y);
      if (speed < 0.001) return;

      const scale = CONFIG.designerCruiseSpeed / speed;
      scene.matter.body.setVelocity(body, {
        x: body.velocity.x * scale,
        y: body.velocity.y * scale
      });
    };

    // Pick the initial direction from the first target. After launch this is
    // NOT called continuously. Direction is changed only on impact.
    launchDesigners = function () {
      designers.forEach(function (designer) {
        chooseTarget(designer);

        let angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
        if (designer.target && designer.target.gameObject && designer.target.gameObject.active) {
          const dx = designer.target.gameObject.x - designer.gameObject.x;
          const dy = designer.target.gameObject.y - designer.gameObject.y;
          angle = Math.atan2(dy, dx);
        }

        setConstantSpeed(designer, angle);
        if (typeof wakeDesigner === 'function') wakeDesigner(designer);
      });
    };

    function reflectVelocityFromNormal(designer, normalX, normalY) {
      const body = designer.gameObject.body;
      if (!body) return;

      let vx = body.velocity.x;
      let vy = body.velocity.y;
      const speed = Math.hypot(vx, vy) || CONFIG.designerCruiseSpeed;

      // Reflect the incoming velocity around the collision normal.
      const dot = vx * normalX + vy * normalY;
      vx = vx - 2 * dot * normalX;
      vy = vy - 2 * dot * normalY;

      // Never allow a near-tangent collision to turn into wall hugging.
      // If the reflected vector still points into the wall, force it outward.
      if (vx * normalX + vy * normalY < 0.05 * speed) {
        vx += normalX * speed * 0.35;
        vy += normalY * speed * 0.35;
      }

      const reflectedAngle = Math.atan2(vy, vx);

      // Steering is deliberately tiny and only happens here, at impact.
      let finalAngle = reflectedAngle;
      if (!designer.target || designer.target.collected || !designer.target.gameObject.active) {
        chooseTarget(designer);
      }

      if (designer.target && designer.target.gameObject.active) {
        const dx = designer.target.gameObject.x - designer.gameObject.x;
        const dy = designer.target.gameObject.y - designer.gameObject.y;
        const targetAngle = Math.atan2(dy, dx);
        const difference = Phaser.Math.Angle.Wrap(targetAngle - reflectedAngle);
        // Maximum steering at an impact is intentionally small.
        const nudge = Phaser.Math.Clamp(difference, -0.10, 0.10);
        finalAngle = reflectedAngle + nudge;
      }

      scene.matter.body.setVelocity(body, {
        x: Math.cos(finalAngle) * CONFIG.designerCruiseSpeed,
        y: Math.sin(finalAngle) * CONFIG.designerCruiseSpeed
      });
      body.isSleeping = false;
    }

    // Replace the collision handler so wall/designer impacts explicitly create
    // a clean bounce. Decor remains static and is still collected normally.
    handleCollisions = function (event) {
      if (!running) return;

      for (const pair of event.pairs) {
        const a = pair.bodyA.gameObject;
        const b = pair.bodyB.gameObject;
        if (!a || !b) continue;

        const designerA = a.designer;
        const designerB = b.designer;
        const itemA = a.item;
        const itemB = b.item;

        // Designer hits designer: Matter handles the physical separation, then
        // both balls receive a tiny post-impact directional correction.
        if (designerA && designerB) {
          if (pair.collision && pair.collision.normal) {
            reflectVelocityFromNormal(designerA, pair.collision.normal.x, pair.collision.normal.y);
            reflectVelocityFromNormal(designerB, -pair.collision.normal.x, -pair.collision.normal.y);
          } else {
            reflectVelocityFromNormal(designerA, 0, 1);
            reflectVelocityFromNormal(designerB, 0, -1);
          }
          continue;
        }

        // Designer hits an arena wall. Use the actual collision normal rather
        // than trying to infer a horizontal/vertical bounce from position.
        const designer = designerA || designerB;
        const wall = (a && a.isArenaWall) ? a : ((b && b.isArenaWall) ? b : null);
        if (designer && wall) {
          let nx = 0;
          let ny = 0;

          if (pair.collision && pair.collision.normal) {
            nx = pair.collision.normal.x;
            ny = pair.collision.normal.y;
            // Matter's normal is bodyA -> bodyB. We need the normal pointing
            // away from the wall and toward the designer.
            if (designerB) {
              nx = -nx;
              ny = -ny;
            }
          }

          if (Math.hypot(nx, ny) < 0.1) {
            const dx = designer.gameObject.x - wall.x;
            const dy = designer.gameObject.y - wall.y;
            const length = Math.hypot(dx, dy) || 1;
            nx = dx / length;
            ny = dy / length;
          }

          reflectVelocityFromNormal(designer, nx, ny);
          continue;
        }

        // Decor collection is unchanged.
        let collector = null;
        let item = null;
        if (designerA && itemB) {
          collector = designerA;
          item = itemB;
        } else if (designerB && itemA) {
          collector = designerB;
          item = itemA;
        }

        if (collector && item && !item.collected) collectItem(collector, item);
      }
    };
  </script>
</body>
</html>
